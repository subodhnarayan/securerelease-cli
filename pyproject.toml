[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "securerelease-cli"
version = "0.1.0"
description = "A modular, evidence-first security readiness CLI for websites, APIs and repositories."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SecureRelease contributors" }]
keywords = ["security", "devsecops", "scanner", "sast", "dast", "readiness"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["httpx>=0.27,<1.0"]

[project.optional-dependencies]
api = ["PyYAML>=6.0"]
ui = ["playwright>=1.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "PyYAML>=6.0"]

[project.scripts]
securerelease = "securerelease.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
securerelease = ["templates/*.html"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
