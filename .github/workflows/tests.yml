name: Tests and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]" build
      - name: Test
        run: python -m pytest
      - name: Build distributions
        run: python -m build
      - name: Check packaged HTML template
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          python -c "from securerelease.models import ScanReport; from securerelease.reports import as_html; assert '<!doctype html>' in as_html(ScanReport(profile='ui', targets=[]))"
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: distributions
          path: dist/*
